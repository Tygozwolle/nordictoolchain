name: Docker Image CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Grant permission to upload images to the repository packages
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Base Image
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/nordictoolchain
          IMAGE_ID=$(echo "$IMAGE_ID" | tr '[:upper:]' '[:lower:]')
          VERSION=$(date +%s)

          echo "Building & pushing base image to $IMAGE_ID"

          docker build . \
            --file Dockerfile \
            --tag "$IMAGE_ID:$VERSION" \
            --tag "$IMAGE_ID:latest"

          docker push "$IMAGE_ID:$VERSION"
          docker push "$IMAGE_ID:latest"

      - name: Build and Push Zigbee Image
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/nordictoolchain
          IMAGE_ID=$(echo "$IMAGE_ID" | tr '[:upper:]' '[:lower:]')

          echo "Building & pushing Zigbee image to $IMAGE_ID:zigbee-v3.2.3"

          docker build . \
            --file dockerfile.zigbee \
            --tag "$IMAGE_ID:zigbee-v3.2.3"

          docker push "$IMAGE_ID:zigbee-v3.2.3"
